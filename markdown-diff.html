<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Diff</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f6f6f4;
    --bg-tertiary: #f0efec;
    --text: #1a1a18;
    --text-secondary: #6b6b67;
    --text-tertiary: #9b9b96;
    --border: rgba(0,0,0,0.12);
    --border-md: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --add-bg: #eafff0;
    --add-hi: #acf2bd;
    --add-text: #1a7f37;
    --del-bg: #fff0f0;
    --del-hi: #ffc0c0;
    --del-text: #cf222e;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg-secondary: #252523;
      --bg-tertiary: #2c2c2a;
      --text: #e8e8e0;
      --text-secondary: #9b9b96;
      --text-tertiary: #6b6b67;
      --border: rgba(255,255,255,0.1);
      --border-md: rgba(255,255,255,0.2);
      --add-bg: #0d2b1a;
      --add-hi: #1a4d2a;
      --add-text: #56d364;
      --del-bg: #2b0d0d;
      --del-hi: #4d1a1a;
      --del-text: #ff7b72;
    }
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg-tertiary);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }

  .container { max-width: 1100px; margin: 0 auto; }

  header { margin-bottom: 1.5rem; }
  header h1 { font-size: 18px; font-weight: 500; }
  header p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }

  .inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .pane label {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-tertiary);
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
  }

  textarea {
    width: 100%;
    height: 180px;
    resize: vertical;
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 10px 12px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  textarea:focus { outline: none; border-color: var(--border-md); }

  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  button {
    font-family: var(--font-sans);
    font-size: 13px;
    padding: 7px 16px;
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s;
  }

  button:hover { background: var(--bg-secondary); }

  button.primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  button.primary:hover { opacity: 0.85; }

  .stats { font-size: 12px; color: var(--text-secondary); margin-left: auto; white-space: nowrap; }
  .stat-add { color: var(--add-text); }
  .stat-del { color: var(--del-text); }

  #diff-out {
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--bg);
    overflow: auto;
  }

  .empty {
    padding: 3rem 2rem;
    text-align: center;
    color: var(--text-tertiary);
    font-size: 14px;
  }

  table.diff {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    font-family: var(--font-mono);
    table-layout: fixed;
  }

  table.diff thead th {
    font-family: var(--font-sans);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    background: var(--bg-secondary);
    padding: 8px 12px;
    border-bottom: 0.5px solid var(--border);
    font-weight: 400;
    text-align: left;
  }

  table.diff thead th.ln-head {
    text-align: right;
    padding-right: 8px;
    width: 44px;
  }

  table.diff thead th.div-head {
    width: 1px;
    padding: 0;
  }

  td.ln {
    width: 44px;
    min-width: 44px;
    text-align: right;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--text-tertiary);
    background: var(--bg-secondary);
    border-right: 0.5px solid var(--border);
    border-bottom: 0.5px solid var(--border);
    user-select: none;
    vertical-align: top;
    line-height: 1.8;
  }

  td.code {
    padding: 3px 12px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.8;
    vertical-align: top;
    border-bottom: 0.5px solid var(--border);
  }

  td.divider {
    width: 1px;
    min-width: 1px;
    padding: 0;
    background: var(--border);
    border-bottom: 0.5px solid var(--border);
  }

  tr:last-child td { border-bottom: none; }

  /* unchanged */
  tr.ctx td.code { color: var(--text); }

  /* pure deletion */
  tr.del td.ln   { background: var(--del-bg); color: var(--del-text); }
  tr.del td.code { background: var(--del-bg); color: var(--del-text); }

  /* pure addition */
  tr.add td.ln   { background: var(--add-bg); color: var(--add-text); }
  tr.add td.code { background: var(--add-bg); color: var(--add-text); }

  /* modified line — left side */
  tr.chg td.ln-del   { background: var(--del-bg); color: var(--del-text); }
  tr.chg td.code-del { background: var(--del-bg); color: var(--del-text); }

  /* modified line — right side */
  tr.chg td.ln-add   { background: var(--add-bg); color: var(--add-text); }
  tr.chg td.code-add { background: var(--add-bg); color: var(--add-text); }

  /* intra-line word highlights */
  mark.del {
    background: var(--del-hi);
    color: var(--del-text);
    border-radius: 2px;
    padding: 0 1px;
    font-style: normal;
  }

  mark.add {
    background: var(--add-hi);
    color: var(--add-text);
    border-radius: 2px;
    padding: 0 1px;
    font-style: normal;
  }

  tr.sep td {
    background: var(--bg-secondary);
    color: var(--text-tertiary);
    font-size: 11px;
    font-family: var(--font-sans);
    text-align: center;
    padding: 4px 0;
    border-top: 0.5px solid var(--border);
    border-bottom: 0.5px solid var(--border);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Markdown diff</h1>
    <p>Side-by-side comparison with word-level highlighting</p>
  </header>

  <div class="inputs">
    <div class="pane">
      <label>Original</label>
      <textarea id="orig" placeholder="Paste original markdown here…" spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <label>Modified</label>
      <textarea id="mod" placeholder="Paste modified markdown here…" spellcheck="false"></textarea>
    </div>
  </div>

  <div class="actions">
    <button class="primary" onclick="runDiff()">Compare</button>
    <button onclick="clearAll()">Clear</button>
    <span class="stats" id="stats"></span>
  </div>

  <div id="diff-out">
    <div class="empty">Paste text above and click Compare</div>
  </div>
</div>

<script>
function lcsOps(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1]
        ? dp[i-1][j-1] + 1
        : Math.max(dp[i-1][j], dp[i][j-1]);
  const ops = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i-1] === b[j-1]) {
      ops.push({ t: '=', av: a[i-1], bv: b[j-1] }); i--; j--;
    } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
      ops.push({ t: '+', bv: b[j-1] }); j--;
    } else {
      ops.push({ t: '-', av: a[i-1] }); i--;
    }
  }
  return ops.reverse();
}

function tokenise(line) {
  return line.match(/\S+|\s+/g) || [''];
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function wordDiff(aLine, bLine) {
  const ops = lcsOps(tokenise(aLine), tokenise(bLine));
  let aHtml = '', bHtml = '';
  for (const op of ops) {
    if (op.t === '=') { aHtml += esc(op.av); bHtml += esc(op.bv); }
    else if (op.t === '-') { aHtml += `<mark class="del">${esc(op.av)}</mark>`; }
    else { bHtml += `<mark class="add">${esc(op.bv)}</mark>`; }
  }
  return { aHtml, bHtml };
}

function runDiff() {
  const orig = document.getElementById('orig').value;
  const mod  = document.getElementById('mod').value;
  const out  = document.getElementById('diff-out');
  const statsEl = document.getElementById('stats');

  if (!orig.trim() && !mod.trim()) {
    out.innerHTML = '<div class="empty">Paste text above and click Compare</div>';
    statsEl.innerHTML = '';
    return;
  }

  const aLines = orig.split('\n');
  const bLines = mod.split('\n');

  if (aLines.length > 600 || bLines.length > 600) {
    out.innerHTML = '<div class="empty">Text too large — please keep under 600 lines each</div>';
    return;
  }

  const lineOps = lcsOps(aLines, bLines);

  let addedLines = 0, deletedLines = 0;
  lineOps.forEach(o => {
    if (o.t === '+') addedLines++;
    else if (o.t === '-') deletedLines++;
  });

  if (addedLines === 0 && deletedLines === 0) {
    out.innerHTML = '<div class="empty">No differences — the texts are identical</div>';
    statsEl.innerHTML = '';
    return;
  }

  statsEl.innerHTML = `<span class="stat-add">+${addedLines} line${addedLines !== 1 ? 's' : ''}</span>&nbsp;&nbsp;<span class="stat-del">−${deletedLines} line${deletedLines !== 1 ? 's' : ''}</span>`;

  // Pair consecutive del+add as modifications
  const rows = [];
  let i = 0;
  while (i < lineOps.length) {
    const op = lineOps[i];
    if (op.t === '=') {
      rows.push({ type: 'ctx', a: op.av, b: op.bv }); i++;
    } else if (op.t === '-' && i + 1 < lineOps.length && lineOps[i+1].t === '+') {
      rows.push({ type: 'chg', a: op.av, b: lineOps[i+1].bv }); i += 2;
    } else if (op.t === '-') {
      rows.push({ type: 'del', a: op.av }); i++;
    } else {
      rows.push({ type: 'add', b: op.bv }); i++;
    }
  }

  let html = `<table class="diff">
    <colgroup>
      <col style="width:44px"><col><col style="width:1px"><col style="width:44px"><col>
    </colgroup>
    <thead><tr>
      <th class="ln-head">#</th><th>Original</th>
      <th class="div-head"></th>
      <th class="ln-head">#</th><th>Modified</th>
    </tr></thead><tbody>`;

  let aNum = 0, bNum = 0;

  for (const row of rows) {
    if (row.type === 'ctx') {
      aNum++; bNum++;
      const e = esc(row.a);
      html += `<tr class="ctx">
        <td class="ln">${aNum}</td><td class="code">${e || '&nbsp;'}</td>
        <td class="divider"></td>
        <td class="ln">${bNum}</td><td class="code">${e || '&nbsp;'}</td>
      </tr>`;
    } else if (row.type === 'del') {
      aNum++;
      html += `<tr class="del">
        <td class="ln">${aNum}</td><td class="code">${esc(row.a) || '&nbsp;'}</td>
        <td class="divider"></td>
        <td class="ln"></td><td class="code">&nbsp;</td>
      </tr>`;
    } else if (row.type === 'add') {
      bNum++;
      html += `<tr class="add">
        <td class="ln"></td><td class="code">&nbsp;</td>
        <td class="divider"></td>
        <td class="ln">${bNum}</td><td class="code">${esc(row.b) || '&nbsp;'}</td>
      </tr>`;
    } else {
      aNum++; bNum++;
      const { aHtml, bHtml } = wordDiff(row.a, row.b);
      html += `<tr class="chg">
        <td class="ln ln-del">${aNum}</td><td class="code code-del">${aHtml || '&nbsp;'}</td>
        <td class="divider"></td>
        <td class="ln ln-add">${bNum}</td><td class="code code-add">${bHtml || '&nbsp;'}</td>
      </tr>`;
    }
  }

  html += '</tbody></table>';
  out.innerHTML = html;
}

function clearAll() {
  document.getElementById('orig').value = '';
  document.getElementById('mod').value  = '';
  document.getElementById('diff-out').innerHTML = '<div class="empty">Paste text above and click Compare</div>';
  document.getElementById('stats').innerHTML = '';
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runDiff();
});
</script>
</body>
</html>
